<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#fff"/>
  <g transform="translate(100 90) scale(2.2)"><circle cx="15" cy="15" r="8.5" fill="none" stroke="#000" stroke-width="1.8"/><path d="M18.6 18.6l5.4 5.4" stroke="#000" stroke-width="1.8" stroke-linecap="round"/><circle cx="15" cy="15" r="2.2" fill="#000"/></g><text x="180" y="138" font-family="Inter" font-weight="600" font-size="28" letter-spacing="10" fill="#000">QAULT</text>
  <text x="1500" y="138" text-anchor="end" font-family="JetBrains Mono" font-weight="500" font-size="22" letter-spacing="4" fill="#7a7a7a">HOW IT WORKS</text>
  <line x1="100" y1="190" x2="1500" y2="190" stroke="#d9d9d9"/>
  <text x="96" y="320" font-family="Instrument Serif" font-size="104" letter-spacing="-2" fill="#000">Your address <tspan font-style="italic">is</tspan> your public key.</text>
  <text x="100" y="398" font-family="Inter" font-size="30" fill="#7a7a7a">Every Solana wallet shows its public key to the world. QAULT doesn't.</text>
  <circle cx="1060" cy="445" r="6" fill="#fff" stroke="#000" stroke-width="1.5"/><line x1="1066" y1="445" x2="1088" y2="445" stroke="#000" stroke-width="1.5"/><circle cx="1094" cy="445" r="6" fill="#fff" stroke="#000" stroke-width="1.5"/><line x1="1100" y1="445" x2="1122" y2="445" stroke="#000" stroke-width="1.5"/><circle cx="1128" cy="445" r="6" fill="#fff" stroke="#000" stroke-width="1.5"/><line x1="1134" y1="445" x2="1156" y2="445" stroke="#000" stroke-width="1.5"/><circle cx="1162" cy="445" r="6" fill="#fff" stroke="#000" stroke-width="1.5"/><line x1="1168" y1="445" x2="1190" y2="445" stroke="#000" stroke-width="1.5"/><circle cx="1196" cy="445" r="6" fill="#fff" stroke="#000" stroke-width="1.5"/><line x1="1202" y1="445" x2="1224" y2="445" stroke="#000" stroke-width="1.5"/><circle cx="1230" cy="445" r="6" fill="#fff" stroke="#000" stroke-width="1.5"/><line x1="1236" y1="445" x2="1258" y2="445" stroke="#000" stroke-width="1.5"/><circle cx="1264" cy="445" r="6" fill="#fff" stroke="#000" stroke-width="1.5"/><line x1="1270" y1="445" x2="1292" y2="445" stroke="#000" stroke-width="1.5"/><circle cx="1298" cy="445" r="6" fill="#fff" stroke="#000" stroke-width="1.5"/><line x1="1304" y1="445" x2="1326" y2="445" stroke="#000" stroke-width="1.5"/><circle cx="1332" cy="445" r="6" fill="#000" stroke="#000" stroke-width="1.5"/><line x1="1338" y1="445" x2="1360" y2="445" stroke="#000" stroke-width="1.5"/><circle cx="1366" cy="445" r="6" fill="#fff" stroke="#000" stroke-width="1.5"/><line x1="1372" y1="445" x2="1394" y2="445" stroke="#000" stroke-width="1.5"/><circle cx="1400" cy="445" r="6" fill="#fff" stroke="#000" stroke-width="1.5"/><line x1="1406" y1="445" x2="1428" y2="445" stroke="#000" stroke-width="1.5"/><circle cx="1434" cy="445" r="6" fill="#fff" stroke="#000" stroke-width="1.5"/><line x1="1440" y1="445" x2="1462" y2="445" stroke="#000" stroke-width="1.5"/><circle cx="1468" cy="445" r="6" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <line x1="100" y1="490" x2="1500" y2="490" stroke="#d9d9d9"/>
  
  <text x="104" y="560" font-family="JetBrains Mono" font-weight="500" font-size="20" letter-spacing="4" fill="#7a7a7a">01 · TODAY</text>
  <text x="104" y="612" font-family="Instrument Serif" font-size="50" fill="#000">A lock in plain view</text>
  <text x="104" y="664" font-family="Inter" font-size="25" fill="#000">Your address is the public key.</text><text x="104" y="700" font-family="Inter" font-size="25" fill="#000">Safe, because no computer</text><text x="104" y="736" font-family="Inter" font-size="25" fill="#000">can work backwards from it.</text>
  
  <text x="580" y="560" font-family="JetBrains Mono" font-weight="500" font-size="20" letter-spacing="4" fill="#7a7a7a">02 · Q-DAY</text>
  <text x="580" y="612" font-family="Instrument Serif" font-size="50" fill="#000">The maths changes</text>
  <text x="580" y="664" font-family="Inter" font-size="25" fill="#000">A big enough quantum computer</text><text x="580" y="700" font-family="Inter" font-size="25" fill="#000">could derive the private key</text><text x="580" y="736" font-family="Inter" font-size="25" fill="#000">from the public one.</text>
  
  <text x="1056" y="560" font-family="JetBrains Mono" font-weight="500" font-size="20" letter-spacing="4" fill="#7a7a7a">03 · QAULT</text>
  <text x="1056" y="612" font-family="Instrument Serif" font-size="50" fill="#000">Hash-based locks</text>
  <text x="1056" y="664" font-family="Inter" font-size="25" fill="#000">One-time keys quantum can't</text><text x="1056" y="700" font-family="Inter" font-size="25" fill="#000">crack. Every spend moves your</text><text x="1056" y="736" font-family="Inter" font-size="25" fill="#000">funds to a fresh vault.</text>
  <line x1="100" y1="790" x2="1500" y2="790" stroke="#d9d9d9"/>
  <text x="104" y="842" font-family="JetBrains Mono" font-weight="500" font-size="24" fill="#000">Check your wallet's exposure → qault.xyz</text>
  <text x="1500" y="842" text-anchor="end" font-family="JetBrains Mono" font-weight="500" font-size="24" fill="#7a7a7a">Vault live on devnet</text></svg>