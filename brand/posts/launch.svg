  <text x="104" y="578" font-family="Instrument Serif" font-size="76" fill="#000">behind <tspan font-style="italic">one</tspan> public key.</text>
  <text x="104" y="652" font-family="Inter" font-weight="500" font-size="30" fill="#7a7a7a">Every ordinary Solana address is its public key, visible to anyone.</text>
